<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de caja | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">

                <div class="mb-4">
                    <h2 class="fw-bold" th:text="${caja.idCaja == null ? 'Registrar caja' : 'Editar caja'}">
                        Registrar caja
                    </h2>
                    <p class="text-muted">
                        Completa los datos de la caja del vendedor.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <form th:action="@{/cajas/guardar}" th:object="${caja}" method="post">
                            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                                <p class="mb-1">No se pudo guardar la caja:</p>
                                <ul class="mb-0">
                                    <li th:each="error : ${#fields.allErrors()}" th:text="${error}">
                                    </li>
                                </ul>
                            </div>

                            <input type="hidden" th:field="*{idCaja}">

                            <!-- Vendedor -->
                            <div class="mb-3">
                                <label for="vendedor" class="form-label">
                                    Vendedor
                                </label>

                                <select id="vendedor" name="vendedorId" class="form-select" required>
                                    <option value="">Selecciona un vendedor</option>

                                    <option th:each="trabajador : ${trabajadores}" th:value="${trabajador.idTrabajador}"
                                        th:text="${trabajador.nombreTra + ' ' + trabajador.apellidoTra}" th:selected="${caja.vendedor != null
                and caja.vendedor.idTrabajador == trabajador.idTrabajador}">
                                    </option>
                                </select>

                                <div class="text-danger small" th:if="${#fields.hasErrors('vendedor')}"
                                    th:errors="*{vendedor}">
                                </div>
                            </div>

                            <!-- Monto inicial -->
                            <div class="mb-3">
                                <label for="montoInicialCaja" class="form-label">
                                    Monto inicial (S/)
                                </label>

                                <input type="number" id="montoInicialCaja" th:field="*{montoInicialCaja}"
                                    class="form-control" min="0" step="0.01" required>

                                <div class="text-danger small" th:if="${#fields.hasErrors('montoInicialCaja')}"
                                    th:errors="*{montoInicialCaja}">
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-save me-1"></i>
                                    Guardar
                                </button>

                                <a th:href="@{/cajas}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
