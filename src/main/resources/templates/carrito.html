<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito de Compras | Yuliana Calzados</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

  <!-- Navbar -->
  <nav th:replace="fragmentos/navbar :: nbar"></nav>
  <!---->
  
  <!-- Contenido Principal: Carrito -->
  <main class="container my-5">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/index}" class="text-dark">Home</a></li>
        <li class="breadcrumb-item"><a th:href="@{/coleccion}" class="text-dark">Colección</a></li>
        <li class="breadcrumb-item active" aria-current="page">Carrito de compras</li>
      </ol>
    </nav>

    <h2 class="fw-bold mb-4">Tu Carrito de Compras</h2>

    <!-- Grid Layout -->
    <div class="row g-4">
      
      <!-- Columna Izquierda: Lista de Productos -->
      <div class="col-lg-8">
        <div id="listaCarrito"></div>
      </div>

      <!-- Columna Derecha: Resumen de Compra -->
      <div class="col-lg-4">
        <!-- Card -->
        <div class="card shadow-sm border-0 p-3">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3">Resumen de compra</h5>

            <!-- List Group -->
            <ul class="list-group list-group-flush mb-4">
              <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0">
                Subtotal
                <span id="subtotalCarrito">S/ 0.00</span>
              </li>
              <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0">
                Costo de envío
                <span id="envioCarrito">S/ 0.00</span>
              </li>
              <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0 fw-bold fs-5 border-top pt-3">
                Total
                <span id="totalCarrito" class="precio-actual">S/ 00.00</span>
              </li>
            </ul>

            <!-- Buttons -->
            <div class="d-grid gap-2">
              <a th:href="@{/checkout}" class="btn btn-dark btn-lg fs-6">Proceder al pago</a>
              <a th:href="@{/coleccion}" class="btn btn-secondary btn-lg fs-6 text-white text-center">Continuar comprando</a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal Iniciar Sesión  -->
  <div th:replace="fragmentos/modal-login :: modal-login"></div>
  <!---->

  <!-- Offcanvas Carrito -->
  <div th:replace="fragmentos/offcanvas-carrito :: offcanvas-carrito"></div>
  <!---->

  <!-- Footer -->
  <div th:replace="fragmentos/footer :: footer"></div>
  <!---->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

  <script th:src="@{/js/carrito.js}"></script>
</body>

</html>
