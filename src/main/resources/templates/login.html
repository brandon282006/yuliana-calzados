<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Yuliana Calzados</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="login-body">

  <main class="login-wrapper">

    <!-- Panel visual -->
    <section class="login-visual d-none d-lg-flex">
      <div class="login-visual-overlay">
        <img class="login-img" th:src="@{/img/login_imagen.jpeg}" alt="Yuliana Calzados">
      </div>

      <div class="login-visual-brand">
        <img th:src="@{/img/logo.jpeg}" alt="Yuliana Calzados"
             class="login-logo-badge">
      </div>

      <div class="login-slogan">
        <span class="login-slogan-line"></span>
        <p>cada paso cuenta una historia</p>
        <span class="login-slogan-line"></span>
      </div>
    </section>

    <!-- Formulario -->
    <section class="login-panel">

      <div class="login-card">

        <div class="text-center mb-4">
          <img th:src="@{/img/logo.jpeg}" alt="Yuliana Calzados"
               class="login-logo d-lg-none mx-auto">
          <span class="login-badge">
            <i class="bi bi-shield-lock"></i> Acceso privado
          </span>
          <h2 class="h3 fw-bold mb-1">Iniciar sesión</h2>
          <p class="text-secondary mb-0">
            Ingresa con tus credenciales de administrador o vendedor.
          </p>
        </div>

        <!-- Mensajes -->
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2"
             th:if="${param.error != null}" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span class="small">Correo o contraseña incorrectos.</span>
        </div>

        <div class="alert alert-warning d-flex align-items-center gap-2 py-2"
             th:if="${param.denegado != null}" role="alert">
          <i class="bi bi-lock-fill"></i>
          <span class="small">Debes iniciar sesión para entrar al panel.</span>
        </div>

        <div class="alert alert-success d-flex align-items-center gap-2 py-2"
             th:if="${param.logout != null}" role="alert">
          <i class="bi bi-check-circle-fill"></i>
          <span class="small">Tu sesión se cerró correctamente.</span>
        </div>

        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>

          <div class="mb-3">
            <label for="correoUsu" class="form-label fw-semibold">
              Correo electrónico
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email"
                     class="form-control"
                     id="correoUsu"
                     name="correoUsu"
                     placeholder="nombre@correo.com"
                     autocomplete="username"
                     required>
            </div>
            <div class="invalid-feedback">
              Ingresa un correo válido.
            </div>
          </div>

          <div class="mb-3">
            <label for="contrasenaUsu" class="form-label fw-semibold">
              Contraseña
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password"
                     class="form-control"
                     id="contrasenaUsu"
                     name="contrasenaUsu"
                     placeholder="Tu contraseña"
                     autocomplete="current-password"
                     required>
              <button class="btn btn-outline-secondary btn-toggle-password"
                      type="button"
                      data-target="contrasenaUsu"
                      aria-label="Mostrar contraseña">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">
              Ingresa tu contraseña.
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100 py-2 login-submit">
            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
          </button>

        </form>

        <div class="text-center mt-4">
          <a th:href="@{/index}" class="link-secondary small">
            <i class="bi bi-arrow-left"></i> Volver a la tienda
          </a>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <script th:src="@{/js/admin.js}"></script>
</body>

</html>
