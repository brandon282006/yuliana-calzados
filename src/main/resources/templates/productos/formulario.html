<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de producto | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/admin-sidebar :: sidebar('productos')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/admin-topbar :: topbar('Productos', 'Registrar o editar producto')}"></div>

            <main class="admin-content">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:href="@{/productos}" class="link-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver a productos
                    </a>
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow text-uppercase small mb-2">CATÁLOGO</p>
                    <h1 class="h3 fw-bold mb-1"
                        th:text="${producto.idProducto == null} ? 'Registrar producto' : 'Editar producto'">
                        Registrar producto
                    </h1>
                    <p class="text-secondary mb-0">
                        Completa los datos del calzado para mantener actualizado tu catálogo.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <span class="stat-icon stat-icon-brown">
                                <i class="bi bi-box-seam"></i>
                            </span>
                            <div>
                                <h2 class="h5 fw-bold mb-1">Información del producto</h2>
                                <p class="text-secondary small mb-0">Los campos marcados son obligatorios.</p>
                            </div>
                        </div>

                        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

                            <input type="hidden" th:field="*{idProducto}">

                            <div class="row g-4">
                                <div class="col-12">
                                    <label for="modeloProd" class="form-label fw-semibold">
                                        Modelo del producto <span class="text-danger">*</span>
                                    </label>
                                    <input type="text"
                                           id="modeloProd"
                                           th:field="*{modeloProd}"
                                           class="form-control"
                                           placeholder="Ej. Tacón elegante"
                                           maxlength="50"
                                           required>
                                    <div class="text-danger small mt-1" th:errors="*{modeloProd}"></div>
                                </div>

                                <div class="col-12">
                                    <label for="descripcionProd" class="form-label fw-semibold">Descripción</label>
                                    <textarea id="descripcionProd"
                                              th:field="*{descripcionProd}"
                                              class="form-control"
                                              rows="4"
                                              maxlength="500"
                                              placeholder="Describe el material, color u otros detalles..."></textarea>
                                    <div class="form-text">Máximo 500 caracteres.</div>
                                    <div class="text-danger small mt-1" th:errors="*{descripcionProd}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="precioProd" class="form-label fw-semibold">
                                        Precio (S/) <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">S/</span>
                                        <input type="number"
                                               id="precioProd"
                                               th:field="*{precioProd}"
                                               class="form-control"
                                               min="0.01"
                                               step="0.01"
                                               placeholder="0.00"
                                               required>
                                    </div>
                                    <div class="text-danger small mt-1" th:errors="*{precioProd}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="categoria" class="form-label fw-semibold">
                                        Categoría <span class="text-danger">*</span>
                                    </label>
                                    <select id="categoria"
                                            th:field="*{categoria.idCategoria}"
                                            class="form-select"
                                            required>
                                        <option value="">Selecciona una categoría</option>
                                        <option th:each="cat : ${categorias}"
                                                th:value="${cat.idCategoria}"
                                                th:text="${cat.nombreCat}">
                                        </option>
                                    </select>
                                    <div class="text-danger small mt-1" th:errors="*{categoria}"></div>
                                    <div th:if="${#lists.isEmpty(categorias)}" class="form-text text-danger">
                                        Primero debes registrar una categoría.
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="estadoProd" class="form-label fw-semibold">
                                        Estado <span class="text-danger">*</span>
                                    </label>
                                    <select id="estadoProd" th:field="*{estadoProd}" class="form-select" required>
                                        <option value="Activo">Activo</option>
                                        <option value="Descontinuado">Descontinuado</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-4 border-top">
                                <a th:href="@{/productos}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-check-lg me-1"></i>
                                    Guardar producto
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
