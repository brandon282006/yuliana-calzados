<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Productos</h1>
            <p class="text-secondary mb-0">
                Administra el catálogo de Yuliana Calzados.
            </p>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/categorias}"
               class="btn btn-outline-secondary">
                Categorías
            </a>

            <a th:href="@{/productos/nuevo}"
               class="btn btn-dark">
                + Nuevo producto
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.idProducto}"></td>

                        <td>
                            <div class="fw-semibold"
                                 th:text="${producto.modeloProd}"></div>
                            <small class="text-secondary"
                                   th:text="${producto.descripcionProd != null
                                   and !producto.descripcionProd.isEmpty()
                                   ? producto.descripcionProd : 'Sin descripción'}">
                            </small>
                        </td>

                        <td th:text="${producto.categoria.nombreCat}"></td>

                        <td>
                            S/
                            <span th:text="${#numbers.formatDecimal(
                                producto.precioProd, 1, 2)}"></span>
                        </td>

                        <td>
                            <span class="badge"
                                  th:classappend="${producto.estadoProd.name() == 'Activo'}
                                  ? ' text-bg-success' : ' text-bg-secondary'"
                                  th:text="${producto.estadoProd}">
                            </span>
                        </td>

                        <td>
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/productos/editar/{id}
                                    (id=${producto.idProducto})}"
                                   class="btn btn-sm btn-outline-dark">
                                    Editar
                                </a>

                                <form th:action="@{/productos/eliminar/{id}
                                    (id=${producto.idProducto})}"
                                      method="post"
                                      onsubmit="return confirm('¿Eliminar este producto?');">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="6"
                            class="text-center text-secondary py-4">
                            Todavía no hay productos registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/index}" class="link-secondary">
            Volver al inicio
        </a>
    </div>

</div>

</body>
</html>
