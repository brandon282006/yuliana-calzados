
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabajadores | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <h1 class="mb-4">Gestión de trabajadores</h1>

    <div class="mb-3">
        <a th:href="@{/trabajadores/nuevo}"
           class="btn btn-dark">
            Nuevo trabajador
        </a>

        <a th:href="@{/usuarios}"
           class="btn btn-outline-secondary">
            Ver usuarios
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Correo</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Teléfono</th>
                    <th>Cargo</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="t : ${trabajadores}">
                    <td th:text="${t.idTrabajador}"></td>
                    <td th:text="${t.usuario.correoUsu}"></td>
                    <td th:text="${t.nombreTra}"></td>
                    <td th:text="${t.apellidoTra}"></td>
                    <td th:text="${t.telefonoTra}"></td>
                    <td th:text="${t.cargoTra}"></td>

                    <td>
                        <a th:href="@{/trabajadores/editar/{id}(id=${t.idTrabajador})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/trabajadores/eliminar/{id}(id=${t.idTrabajador})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('¿Deseas eliminar este trabajador?')">

                            <button type="submit"
                                    class="btn btn-danger btn-sm">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(trabajadores)}">
                    <td colspan="7" class="text-center">
                        Todavía no hay trabajadores registrados.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
