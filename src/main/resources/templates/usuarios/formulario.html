<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de usuario | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/admin-sidebar :: sidebar('usuarios')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/admin-topbar :: topbar('Usuarios', 'Registrar o editar usuario')}"></div>

            <main class="admin-content">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:href="@{/usuarios}" class="link-secondary text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>
                        Volver a usuarios
                    </a>
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow text-uppercase small mb-2">ADMINISTRACIÓN</p>
                    <h1 class="h3 fw-bold mb-1"
                        th:text="${usuario.idUsuario == null ? 'Nuevo usuario' : 'Editar usuario'}">
                        Nuevo usuario
                    </h1>
                    <p class="text-secondary mb-0">
                        Completa la información de acceso y el estado de la cuenta.
                    </p>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <span class="stat-icon stat-icon-brown">
                                <i class="bi bi-person-gear"></i>
                            </span>
                            <div>
                                <h2 class="h5 fw-bold mb-1">Información del usuario</h2>
                                <p class="text-secondary small mb-0">Completa los datos para guardar la cuenta.</p>
                            </div>
                        </div>

                        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">

                            <input type="hidden" th:field="*{idUsuario}">

                            <div class="row g-4">
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="correoUsu">
                                        Correo electrónico <span class="text-danger">*</span>
                                    </label>
                                    <input type="email"
                                           id="correoUsu"
                                           th:field="*{correoUsu}"
                                           class="form-control"
                                           placeholder="nombre@ejemplo.com"
                                           autocomplete="email"
                                           required>
                                    <div class="text-danger small mt-1" th:errors="*{correoUsu}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-semibold" for="contrasenaUsu">
                                        Contraseña <span class="text-danger">*</span>
                                    </label>
                                    <input type="password"
                                           id="contrasenaUsu"
                                           th:field="*{contrasenaUsu}"
                                           class="form-control"
                                           minlength="8"
                                           autocomplete="new-password"
                                           required>
                                    <div class="form-text">Debe tener al menos 8 caracteres.</div>
                                    <div class="text-danger small mt-1" th:errors="*{contrasenaUsu}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-semibold" for="estadoUsu">
                                        Estado <span class="text-danger">*</span>
                                    </label>
                                    <select id="estadoUsu" th:field="*{estadoUsu}" class="form-select" required>
                                        <option value="Activo">Activo</option>
                                        <option value="Inactivo">Inactivo</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-4 border-top">
                                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-check-lg me-1"></i>
                                    Guardar usuario
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
