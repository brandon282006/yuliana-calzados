<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-shell">

        <div th:replace="~{fragmentos/admin-sidebar :: sidebar('usuarios')}"></div>

        <div class="admin-main">

            <div th:replace="~{fragmentos/admin-topbar :: topbar('Usuarios', 'Gestión de usuarios del sistema')}"></div>

            <main class="admin-content">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                    <div>
                        <p class="admin-eyebrow text-uppercase small mb-2">ADMINISTRACIÓN</p>
                        <h1 class="h3 fw-bold mb-1">Gestión de usuarios</h1>
                        <p class="text-secondary mb-0">
                            Consulta y administra los usuarios del sistema.
                        </p>
                    </div>

                    <a th:href="@{/usuarios/nuevo}" class="btn btn-dark">
                        <i class="bi bi-person-plus me-1"></i>
                        Nuevo usuario
                    </a>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">

                        <div class="table-responsive" th:if="${!#lists.isEmpty(usuarios)}">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Correo</th>
                                        <th class="text-center">Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="u : ${usuarios}">
                                        <td th:text="${u.idUsuario}">1</td>
                                        <td class="fw-semibold" th:text="${u.correoUsu}">
                                            usuario@ejemplo.com
                                        </td>
                                        <td class="text-center">
                                            <span class="badge rounded-pill"
                                                  th:classappend="${u.estadoUsu != null and u.estadoUsu.toString() == 'Activo'}
                                                  ? 'text-bg-success' : 'text-bg-secondary'"
                                                  th:text="${u.estadoUsu}">
                                                Activo
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <div class="d-flex justify-content-center gap-2">
                                                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                                                   class="btn btn-sm btn-outline-dark"
                                                   title="Editar usuario"
                                                   aria-label="Editar usuario">
                                                    <i class="bi bi-pencil"></i>
                                                </a>

                                                <form th:action="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}"
                                                      method="post"
                                                      onsubmit="return confirm('¿Eliminar este usuario?');">
                                                    <button class="btn btn-sm btn-outline-danger"
                                                            type="submit"
                                                            title="Eliminar usuario"
                                                            aria-label="Eliminar usuario">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="text-center py-5" th:if="${#lists.isEmpty(usuarios)}">
                            <i class="bi bi-people fs-1 text-secondary"></i>
                            <h5 class="mt-3">No hay usuarios registrados</h5>
                            <p class="text-secondary">
                                Registra un usuario para que aparezca en esta lista.
                            </p>
                            <a th:href="@{/usuarios/nuevo}" class="btn btn-dark">
                                <i class="bi bi-person-plus me-1"></i>
                                Nuevo usuario
                            </a>
                        </div>

                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
