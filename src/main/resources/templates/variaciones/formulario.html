<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestionar talla | Yuliana Calzados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FAF7F2;
            color: #1A1A1A;
        }

        .navbar {
            background-color: #1A1A1A;
        }

        .navbar-brand {
            color: #C9A86A;
            font-weight: 700;
        }

        .formulario {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .titulo {
            color: #1d1714;
            font-weight: 700;
        }

        .btn-calzado {
            background-color: #8B6B4F;
            color: white;
        }

        .btn-calzado:hover {
            background-color: #6f523b;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/index}">
                Yuliana Calzados
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">

                <div class="mb-4">
                    <h1 class="titulo h3" th:text="${variacion.idVariacion == null}
                    ? 'Registrar talla'
                    : 'Editar talla'">
                        Gestionar talla
                    </h1>

                    <p class="text-secondary">
                        Registra el modelo, la talla y las unidades disponibles.
                    </p>
                </div>

                <div class="formulario">

                    <form th:action="@{/variaciones/guardar}" th:object="${variacion}" method="post">

                        <input type="hidden" th:field="*{idVariacion}">

                        <div class="mb-3">

                            <label for="idProducto" class="form-label">
                                Producto
                            </label>

                            <select id="idProducto" name="idProducto" class="form-select" required>

                                <option value="">
                                    Selecciona un modelo
                                </option>

                                <option th:each="producto : ${productos}" th:value="${producto.idProducto}"
                                    th:text="${producto.modeloProd}" th:selected="${variacion.producto != null
                                    and variacion.producto.idProducto == producto.idProducto}">
                                </option>

                            </select>

                            <div class="text-danger small" th:if="${#fields.hasErrors('producto')}"
                                th:errors="*{producto}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="talla" class="form-label">
                                Talla
                            </label>

                            <input type="text" id="talla" th:field="*{talla}" class="form-control"
                                placeholder="Ejemplo: 37" maxlength="10" required>

                            <div class="text-danger small" th:if="${#fields.hasErrors('talla')}" th:errors="*{talla}">
                            </div>

                        </div>

                        <div class="mb-3">
                            <label for="colorPv" class="form-label">Color</label>

                            <input type="text" id="colorPv" th:field="*{colorPv}" class="form-control"
                                placeholder="Ej. Negro, Beige, Marrón" maxlength="50" required>

                            <div class="text-danger small" th:if="${#fields.hasErrors('colorPv')}"
                                th:errors="*{colorPv}">
                            </div>
                        </div>

                        <div class="mb-4">

                            <label for="stock" class="form-label">
                                Stock disponible
                            </label>

                            <input type="number" id="stock" th:field="*{stock}" class="form-control" min="0" required>

                            <div class="text-danger small" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">
                            </div>

                        </div>

                        <div class="d-flex flex-wrap gap-2">

                            <button type="submit" class="btn btn-calzado">
                                <i class="bi bi-save"></i>
                                Guardar
                            </button>

                            <a th:href="@{/variaciones}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
